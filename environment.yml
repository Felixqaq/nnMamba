name: nnMamba
channels:
  - pytorch
  - conda-forge
dependencies:
  # Python version
  - python=3.10

  # PyTorch with CUDA support (for GPU acceleration)
  - pytorch::pytorch::py310_cuda12_cudnn9_0
  - pytorch::pytorch-cuda=12.1
  - pytorch::cudnn
  - pytorch::torchvision
  - pytorch::torchaudio

  # Core deep learning dependencies
  - pip

# pip dependencies
pip:
  - mamba-ssm>=0.1.0
  - nibabel>=4.0.0
  - torchmetrics>=0.11.0
  - batchgenerators>=0.25
  - scikit-image>=0.19.0
  - SimpleITK>=2.2.0
  - pyyaml>=6.0
  - tqdm>=4.60.0
  - numpy>=1.22.0
  - pandas>=1.4.0
  - matplotlib>=3.5.0

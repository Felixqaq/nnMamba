# Normal vs Abnormal — TAP-CT-ONLY frozen-embedding probe (option A)
# =====================================================================
# Isolates "how much signal is in the frozen pretrained TAP-CT-S-3D
# embedding" by training ONLY a light ABMIL classification head on the
# precomputed 1152-d embeddings — no CT image encoder is trained.
# Same protocol as config.cmp.normal_v_abnormal.fusion.yaml (50 epochs,
# no early stop, cmp manifest) so image-only / fusion / TAP-CT-only form
# a clean 3-way comparison on the identical 54-case patient-level folds.

experiment:
  name: CMP TAP-CT-only probe (no-earlystop 50ep)
  description: Normal/Abnormal, frozen TAP-CT-S-3D embedding + ABMIL head only. Controlled protocol matching the fusion/image-only comparison.

model:
  name: tapct_abmil
  in_channels: 1
  num_classes: 2
  hidden_dim: 256
  dropout: 0.3
  base_channels: 32
  blocks: 3
  attn_heads: 8
  attn_layers: 1
  attn_mlp_ratio: 2.0
  attn_dropout: 0.1
  tapct_embedding_dim: 1152
  tapct_attention_dim: 128
  tapct_gated_attention: true
  fusion_projection_dim: 128
  fusion_dropout: 0.1
  feature_size: 24
  depths: [2, 2, 2, 2]
  num_heads: [3, 6, 12, 24]
  window_size: 4
  patch_size: 2
  use_checkpoint: false
  use_v2: true

training:
  epochs: 50
  batch_size: 12
  eval_batch_size: 12
  swin_batch_size: 5
  swin_eval_batch_size: 6
  learning_rate: 0.0001
  weight_decay: 0.001
  k_folds: 5
  eval_interval: 5
  save_interval: 10
  seed: 42
  loss: cross_entropy
  clip_grad_norm: 1.0
  amp: false
  track_train_metrics: false
  class_weight_mode: none

early_stopping:
  enabled: false
  patience: 6
  min_delta: 0.005

gradcam:
  enabled: false
  max_samples: 8
  target_layer: image_encoder.attention_layers
  target_class: 0

data:
  target_mode: normal_v_abnormal
  source_dir: ../classification/datasets/normal_v_abnormal_54
  labels_json: ../patient_angle_classification_by_group.json
  manifest: ./datasets/generated/normal_v_abnormal_manifest.cmp.json
  tapct_features: ./embeddings/tapct_s_3d/features.npz
  tapct_feature_key: features
  image_size: [112, 136, 112]
  intensity_window: [-1000.0, 400.0]
  input_normalization: zscore
  target_normalization: none
  cache_data: true
  num_workers: 4
  pin_memory: true
  prefetch_factor: 4
  angle_bin_count: 5
  balanced_sampling: true
  augmentation:
    enabled: true
    balance_then_augment: true
    views_per_sample: 5
    probability: 1.0
    class_indices: [0, 1]
    rotation_degrees: 7.0
    translation_fraction: 0.05
    scale_range: [0.95, 1.05]
    intensity_scale_range: [0.95, 1.05]
    intensity_shift_range: [-0.1, 0.1]
    noise_std: 0.03

paths:
  weights: ./weights
  logs: ./train_log
  figures: ./figures
  graphs: ./graphs

task: Normal_v_Abnormal_cmp

resume:
  enabled: false
  uuid: null
  start_fold: 0

gpu:
  device_id: "0"

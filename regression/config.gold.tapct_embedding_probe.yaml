# TAP-CT-B frozen embedding probe for GOLD stage classification.
#
# Reuses embeddings already extracted under regression/embeddings/tapct_b_3d.
# Run from the repository root:
#   conda run -n nnMamba python regression/scripts/run_tapct_embedding_probe.py \
#     --config regression/config.gold.tapct_embedding_probe.yaml

experiment:
  name: tapct_b_3d_gold_embedding_probe

run:
  extract_embeddings: false
  train_probe: true

data:
  source_root: by_angle_all
  labels_json: patient_angle_classification_by_group.json
  pft_json: pft.json

embedding:
  output_dir: regression/embeddings/tapct_b_3d

probe:
  # features defaults to embedding.output_dir/features.npz.
  features: null
  metadata: null
  output_dir: regression/figures/TAPCT_embedding_probes/tapct_b_3d_gold_yaml
  target: gold
  model: all
  n_splits: 3
  seed: 42
  ridge_alpha: 1.0
  plots: true
  plot_dpi: 180

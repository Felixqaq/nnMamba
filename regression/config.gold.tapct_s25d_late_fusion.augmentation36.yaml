# nnMamba GOLD Stage Classification with TAP-CT-S-2.5D Late Fusion, 36/Class
# ==============================================================================

experiment:
  name: GOLD TAP-CT-S-2.5D late fusion + aug36/class
  description: Hybrid Mamba-Attention CT features are concatenated with frozen TAP-CT-S-2.5D patient-level embeddings while GOLD 2026 train folds are augmented to 36 samples/class before balanced sampling.

model:
  name: hybrid_mamba_tapct_fusion
  in_channels: 1
  num_classes: 5
  hidden_dim: 256
  dropout: 0.3
  base_channels: 32
  blocks: 3
  attn_heads: 8
  attn_layers: 1
  attn_mlp_ratio: 2.0
  attn_dropout: 0.1
  tapct_embedding_dim: 1152
  fusion_projection_dim: 128
  fusion_dropout: 0.1

  # SwinUNETR-only settings. Kept for consistency with other configs.
  feature_size: 24
  depths: [2, 2, 2, 2]
  num_heads: [3, 6, 12, 24]
  window_size: 4
  patch_size: 2
  use_checkpoint: false
  use_v2: true

training:
  epochs: 160
  batch_size: 12
  eval_batch_size: 12
  swin_batch_size: 5
  swin_eval_batch_size: 6
  learning_rate: 0.0001
  weight_decay: 0.001
  k_folds: 2
  eval_interval: 5
  save_interval: 10
  seed: 42
  loss: auto
  clip_grad_norm: 1.0
  amp: false
  track_train_metrics: false
  class_weight_mode: none

early_stopping:
  enabled: true
  patience: 6
  min_delta: 0.005

data:
  target_mode: gold
  source_dir: ../by_angle_all
  labels_json: ../patient_angle_classification_by_group.json
  pft_json: ./GOLD_2026_classification.json
  angle_split_manifest: ../by_angle_all/reclassification_manifest.json
  manifest: ./datasets/generated/gold_2026_manifest.tapct_s25d_aug36.json
  tapct_features: ./embeddings/tapct_s_2_5d/features.npz
  image_size: [112, 136, 112]
  intensity_window: [-1000.0, 400.0]
  input_normalization: zscore
  target_normalization: none
  cache_data: true
  num_workers: 4
  pin_memory: true
  prefetch_factor: 4
  angle_bin_count: 5
  balanced_sampling: true
  augmentation:
    enabled: true
    balance_to_majority: false
    target_per_class: 36
    probability: 1.0
    # GOLD 2026 classes are zero-based, including class 0 for no COPD.
    class_indices: [0, 1, 2, 3, 4]
    rotation_degrees: 7.0
    translation_fraction: 0.05
    scale_range: [0.95, 1.05]
    intensity_scale_range: [0.95, 1.05]
    intensity_shift_range: [-0.1, 0.1]
    noise_std: 0.03

paths:
  weights: ./weights
  logs: ./train_log
  figures: ./figures
  graphs: ./graphs

task: GOLD_stage_classification

resume:
  enabled: false
  uuid: null
  start_fold: 0

gpu:
  device_id: "0"

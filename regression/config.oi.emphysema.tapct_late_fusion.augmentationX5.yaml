# nnMamba OI Emphysema Binary Classification with TAP-CT Late Fusion (5x augmentation)
# =====================================================================================
# Same setup as config.oi.emphysema.tapct_late_fusion.yaml, but expands the
# training set 5x with train-only CT augmentation. Each base sample emits one
# original view plus four augmented views (views_per_sample: 5). Augmented copies
# are kept out of validation, so reported metrics stay leakage-free.
#
# data.oi_threshold selects the OI cutpoint (see regression/OI.pdf):
#   3.0  -> mild/early subgroup cutpoint. Splits this cohort 34/32
#           (emphysema/no-emphysema) -> the most balanced binary split.
#   4.38 -> best overall predictive cutpoint (LAV% 30% reference); 24/42.
#   7.0  -> severe-obstruction subgroup cutpoint (FEV1% <= 40%); 17/49.
# Class 0 is the emphysema (abnormal) endpoint so reported binary
# sensitivity/specificity describe the disease-positive class.

experiment:
  name: OI emphysema TAP-CT late fusion (OI >= 3.0, 5x aug)
  description: Binary emphysema classification from the OI obstruction index, fusing CT features with frozen TAP-CT-B 3D embeddings. Training set expanded 5x with train-only augmentation (1 original + 4 augmented views per sample).

model:
  name: hybrid_mamba_tapct_fusion
  in_channels: 1
  num_classes: 2
  hidden_dim: 256
  dropout: 0.3
  base_channels: 32
  blocks: 3
  attn_heads: 8
  attn_layers: 1
  attn_mlp_ratio: 2.0
  attn_dropout: 0.1
  tapct_embedding_dim: 2304
  fusion_projection_dim: 128
  fusion_dropout: 0.1

  # SwinUNETR-only settings. Kept for consistency with other configs.
  feature_size: 24
  depths: [2, 2, 2, 2]
  num_heads: [3, 6, 12, 24]
  window_size: 4
  patch_size: 2
  use_checkpoint: false
  use_v2: true

training:
  epochs: 160
  batch_size: 12
  eval_batch_size: 12
  swin_batch_size: 5
  swin_eval_batch_size: 6
  learning_rate: 0.0001
  weight_decay: 0.001
  k_folds: 5
  eval_interval: 5
  save_interval: 10
  seed: 42
  loss: cross_entropy
  clip_grad_norm: 1.0
  amp: false
  track_train_metrics: false
  class_weight_mode: none

early_stopping:
  enabled: true
  patience: 6
  min_delta: 0.005

gradcam:
  enabled: true
  max_samples: 8
  target_layer: image_encoder.attention_layers
  target_class: 0

data:
  target_mode: oi_emphysema
  oi_threshold: 3.0
  source_dir: ../by_angle_all
  labels_json: ../patient_angle_classification_by_group.json
  pft_json: ../pft.json
  oi_json: ./oi_processed.json
  angle_split_manifest: ../by_angle_all/reclassification_manifest.json
  manifest: ./datasets/generated/oi_emphysema_manifest.tapct_late_fusion.aug5.json
  tapct_features: ./embeddings/tapct_b_3d/features.npz
  image_size: [112, 136, 112]
  intensity_window: [-1000.0, 400.0]
  input_normalization: zscore
  target_normalization: none
  cache_data: true
  num_workers: 4
  pin_memory: true
  prefetch_factor: 4
  angle_bin_count: 5
  balanced_sampling: true
  # 5x training-set expansion: 1 original + 4 augmented views per base sample.
  # balance_then_augment first undersamples to the minority class each epoch,
  # then emits views_per_sample copies of every selected sample.
  augmentation:
    enabled: true
    balance_then_augment: true
    views_per_sample: 5
    probability: 1.0
    class_indices: [0, 1]
    rotation_degrees: 7.0
    translation_fraction: 0.05
    scale_range: [0.95, 1.05]
    # Intensity jitter runs after zscore normalization, so values are in
    # normalized units (matches the GOLD severity4 aug config).
    intensity_scale_range: [0.95, 1.05]
    intensity_shift_range: [-0.1, 0.1]
    noise_std: 0.03

paths:
  weights: ./weights
  logs: ./train_log
  figures: ./figures
  graphs: ./graphs

task: OI_emphysema_classification

resume:
  enabled: false
  uuid: null
  start_fold: 0

gpu:
  device_id: "0"

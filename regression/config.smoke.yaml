# Quick smoke config for validating regression training stability.

model:
  name: nnmamba_regressor
  in_channels: 1
  base_channels: 32
  blocks: 3
  hidden_dim: 128
  dropout: 0.3

training:
  epochs: 15
  batch_size: 8
  eval_batch_size: 8
  learning_rate: 0.0001
  weight_decay: 0.001
  k_folds: 2
  eval_interval: 5
  save_interval: 5
  seed: 42
  loss: smooth_l1
  clip_grad_norm: 1.0

data:
  source_dir: ../by_angle_all
  labels_json: ../patient_angle_classification_by_group.json
  angle_split_manifest: ../by_angle_all/reclassification_manifest.json
  manifest: ./datasets/generated/regression_manifest.smoke.json
  image_size: [112, 136, 112]
  intensity_window: [-1000.0, 400.0]
  target_normalization: zscore
  cache_data: true
  num_workers: 4
  pin_memory: true
  prefetch_factor: 4
  angle_bin_count: 5

paths:
  weights: ./weights
  logs: ./train_log
  figures: ./figures
  graphs: ./graphs

task: PFT_angle_regression

resume:
  enabled: false
  uuid: null
  start_fold: 0

gpu:
  device_id: "0"

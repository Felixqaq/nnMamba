# RQ1 image arm on the 240-patient cohort, as a 5-member majority-vote ensemble.
#
# Members differ only in their training seed; split_seed is pinned so all five see
# the identical folds and can therefore be voted per patient. Member 1 reuses the
# seed-42 run finished 2026-08-21, so only four are trained here — about 7 hours
# rather than 8.75.
#
# Worth carrying into the read-out: hard majority voting buys little when members
# are badly calibrated, and this model outputs almost exclusively 0.000 or 1.000 —
# five confidently-wrong members vote the same way. vote_sizes therefore also scores
# 1 and 3, so the gain per added member is visible rather than assumed.

experiment:
  name: RQ1_normal_v_abnormal image (240, FEV1/FVC 70) majority-5
  description: normal_v_abnormal | hybrid_mamba_attention | 182-patient (66+116)
    FEV1/FVC<70 labelling (100ep, no early stop, seed 42, 5-fold).
model:
  name: hybrid_mamba_attention
  num_classes: 2
  in_channels: 1
  hidden_dim: 256
  dropout: 0.3
  base_channels: 32
  blocks: 3
  attn_heads: 8
  attn_layers: 1
  attn_mlp_ratio: 2.0
  attn_dropout: 0.1
  tapct_embedding_dim: 1152
  fusion_projection_dim: 128
  fusion_dropout: 0.1
  feature_size: 24
  depths:
  - 2
  - 2
  - 2
  - 2
  num_heads:
  - 3
  - 6
  - 12
  - 24
  window_size: 4
  patch_size: 2
  use_checkpoint: false
  use_v2: true
training:
  epochs: 2
  batch_size: 12
  eval_batch_size: 12
  # 8 is the throughput sweet spot on this 8 GB card, measured: 9.2 ms/sample
  # against 13.8 at batch 5. Larger is worse, not better — 10 and 12 both fall
  # back to ~10.1 ms/sample because the card becomes bandwidth-bound.
  swin_batch_size: 8
  swin_eval_batch_size: 8
  learning_rate: 0.0001
  weight_decay: 0.001
  k_folds: 5
  eval_interval: 5
  save_interval: 10
  seed: 42
  loss: cross_entropy
  clip_grad_norm: 1.0
  # fp16 autocast: 13.8 -> 11.2 ms/sample. TF32 and cudnn.benchmark are already
  # on for every run via core.runtime.configure_torch_runtime, so this is the
  # remaining GPU-side gain. Numerics differ slightly from the earlier fp32 runs.
  amp: true
  track_train_metrics: false
  class_weight_mode: none
early_stopping:
  enabled: false
  patience: 6
  min_delta: 0.005
gradcam:
  enabled: false
  max_samples: 8
  target_layer: image_encoder.attention_layers
  target_class: 0
ensemble:
  enabled: false

data:
  target_mode: normal_v_abnormal
  source_dir: ../classification/datasets/normal_v_abnormal_fev1fvc70
  labels_json: ../patient_angle_classification_by_group.json
  manifest: ./datasets/generated/rq1_fev1fvc70_manifest.image.json
  tapct_features: null
  image_size:
  - 112
  - 136
  - 112
  intensity_window:
  - -1000.0
  - 400.0
  input_normalization: zscore
  target_normalization: none
  cache_data: true
  # pin_memory is what died on this 8 GB card — the page-locked allocation in the
  # loader's pin thread raised a CUDA OOM on the very first batch. Workers were
  # not the cause and are needed: augmentation (affine grid_sample plus intensity
  # jitter on a 112x136x112 volume, five views per sample) runs on the CPU, so
  # with num_workers=0 it serialises against the GPU and leaves it ~26% busy while
  # the main process burns 2.4 cores. Prefetching in workers overlaps the two.
  num_workers: 4
  pin_memory: false
  prefetch_factor: 4
  angle_bin_count: 5
  balanced_sampling: true
  augmentation:
    enabled: true
    # Augment on the card, not in the workers. Measured on this box
    # (Ryzen 5 5600X, 6 cores): one 112x136x112 grid_sample is 99 ms
    # on a worker core against 5.2 ms/view batched on the 3060 Ti, so
    # the CPU path cost ~793 ms per batch of 8 and pinned the GPU at
    # 16%. See RandomCTAugmentation.apply_batch.
    device: gpu
    balance_then_augment: true
    views_per_sample: 5
    probability: 1.0
    class_indices:
    - 0
    - 1
    rotation_degrees: 7.0
    translation_fraction: 0.05
    scale_range:
    - 0.95
    - 1.05
    intensity_scale_range:
    - 0.95
    - 1.05
    intensity_shift_range:
    - -0.1
    - 0.1
    noise_std: 0.03
task: RQ1_normal_v_abnormal_fev1fvc70
resume:
  enabled: false
  uuid: null
  start_fold: 0
gpu:
  device_id: '0'

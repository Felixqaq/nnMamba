<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="980" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6F1E8"/>
      <stop offset="1" stop-color="#E7EEF6"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDFC"/>
      <stop offset="1" stop-color="#F7FAFD"/>
    </linearGradient>
    <linearGradient id="mainBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F5D5E"/>
      <stop offset="1" stop-color="#198E8F"/>
    </linearGradient>
    <linearGradient id="stageBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B55332"/>
      <stop offset="1" stop-color="#D97A4B"/>
    </linearGradient>
    <linearGradient id="poolBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#324B7A"/>
      <stop offset="1" stop-color="#5677B5"/>
    </linearGradient>
    <linearGradient id="headBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5E3A7A"/>
      <stop offset="1" stop-color="#8A59AD"/>
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0 0L14 7L0 14V9H8V5H0V0Z" fill="#355C7D"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#223344" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 30px 'DejaVu Sans', Arial, sans-serif; fill: #16212B; }
      .subtitle { font: 500 15px 'DejaVu Sans', Arial, sans-serif; fill: #4A5C6E; }
      .section { font: 700 18px 'DejaVu Sans', Arial, sans-serif; fill: #213140; }
      .boxTitle { font: 700 19px 'DejaVu Sans', Arial, sans-serif; fill: #FFFFFF; }
      .boxText { font: 500 13px 'DejaVu Sans Mono', 'Courier New', monospace; fill: #F7FBFF; }
      .lightBoxTitle { font: 700 17px 'DejaVu Sans', Arial, sans-serif; fill: #213140; }
      .lightBoxText { font: 500 13px 'DejaVu Sans Mono', 'Courier New', monospace; fill: #36485A; }
      .note { font: 500 12px 'DejaVu Sans Mono', 'Courier New', monospace; fill: #60758A; }
      .connector { stroke: #355C7D; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .thinConnector { stroke: #547392; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 9 8; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="980" fill="url(#bg)"/>

  <rect x="34" y="28" width="1532" height="924" rx="28" fill="url(#panel)" stroke="#D5DFE8" stroke-width="2" filter="url(#shadow)"/>

  <text x="70" y="82" class="title">MambaAngleRegressor Architecture</text>
  <text x="70" y="110" class="subtitle">Configuration shown: input=1x112x136x112, base_channels=32, depths=(3,3,3), dropout=0.3</text>
  <text x="70" y="160" class="section">Main data flow</text>

  <rect x="70" y="198" width="180" height="110" rx="22" fill="url(#mainBox)" filter="url(#shadow)"/>
  <text x="95" y="238" class="boxTitle">Input CT Volume</text>
  <text x="95" y="266" class="boxText">shape: [B, 1, 112, 136, 112]</text>
  <text x="95" y="288" class="boxText">window + normalize in loader</text>

  <rect x="290" y="180" width="215" height="146" rx="22" fill="url(#mainBox)" filter="url(#shadow)"/>
  <text x="316" y="220" class="boxTitle">Stem</text>
  <text x="316" y="248" class="boxText">Conv3d 7x7x7, stride=4</text>
  <text x="316" y="270" class="boxText">GroupNorm + GELU</text>
  <text x="316" y="292" class="boxText">output: [B, 32, 28, 34, 28]</text>

  <rect x="548" y="164" width="250" height="178" rx="22" fill="url(#stageBox)" filter="url(#shadow)"/>
  <text x="574" y="204" class="boxTitle">Stage 1</text>
  <text x="574" y="232" class="boxText">DownsampleStage(stride=1)</text>
  <text x="574" y="254" class="boxText">3x3x3 Conv -> GN -> GELU</text>
  <text x="574" y="276" class="boxText">3x ResidualMambaBlock</text>
  <text x="574" y="298" class="boxText">output: [B, 32, 28, 34, 28]</text>

  <rect x="842" y="164" width="250" height="178" rx="22" fill="url(#stageBox)" filter="url(#shadow)"/>
  <text x="868" y="204" class="boxTitle">Stage 2</text>
  <text x="868" y="232" class="boxText">DownsampleStage(stride=2)</text>
  <text x="868" y="254" class="boxText">3x3x3 Conv -> GN -> GELU</text>
  <text x="868" y="276" class="boxText">3x ResidualMambaBlock</text>
  <text x="868" y="298" class="boxText">output: [B, 64, 14, 17, 14]</text>

  <rect x="1136" y="164" width="250" height="178" rx="22" fill="url(#stageBox)" filter="url(#shadow)"/>
  <text x="1162" y="204" class="boxTitle">Stage 3</text>
  <text x="1162" y="232" class="boxText">DownsampleStage(stride=2)</text>
  <text x="1162" y="254" class="boxText">3x3x3 Conv -> GN -> GELU</text>
  <text x="1162" y="276" class="boxText">3x ResidualMambaBlock</text>
  <text x="1162" y="298" class="boxText">output: [B, 128, 7, 9, 7]</text>

  <path d="M250 253H290" class="connector"/>
  <path d="M505 253H548" class="connector"/>
  <path d="M798 253H842" class="connector"/>
  <path d="M1092 253H1136" class="connector"/>

  <text x="70" y="420" class="section">Multi-scale pooling and regression head</text>

  <rect x="548" y="468" width="215" height="118" rx="20" fill="url(#poolBox)" filter="url(#shadow)"/>
  <text x="573" y="507" class="boxTitle">Pool from Stage 1</text>
  <text x="573" y="535" class="boxText">AdaptiveAvgPool3d(1)</text>
  <text x="573" y="557" class="boxText">flatten -> 32-dim</text>

  <rect x="820" y="468" width="215" height="118" rx="20" fill="url(#poolBox)" filter="url(#shadow)"/>
  <text x="845" y="507" class="boxTitle">Pool from Stage 2</text>
  <text x="845" y="535" class="boxText">AdaptiveAvgPool3d(1)</text>
  <text x="845" y="557" class="boxText">flatten -> 64-dim</text>

  <rect x="1092" y="468" width="215" height="118" rx="20" fill="url(#poolBox)" filter="url(#shadow)"/>
  <text x="1117" y="507" class="boxTitle">Pool from Stage 3</text>
  <text x="1117" y="535" class="boxText">AdaptiveAvgPool3d(1)</text>
  <text x="1117" y="557" class="boxText">flatten -> 128-dim</text>

  <path d="M673 342V468" class="thinConnector"/>
  <path d="M967 342V468" class="thinConnector"/>
  <path d="M1261 342V468" class="thinConnector"/>

  <rect x="715" y="664" width="420" height="152" rx="24" fill="url(#headBox)" filter="url(#shadow)"/>
  <text x="742" y="705" class="boxTitle">Feature Fusion + Regression Head</text>
  <text x="742" y="733" class="boxText">concat [32, 64, 128] -> 224-dim</text>
  <text x="742" y="755" class="boxText">Linear 224 -> 128 -> GELU -> Dropout</text>
  <text x="742" y="777" class="boxText">Linear 128 -> 64 -> GELU -> Dropout</text>
  <text x="742" y="799" class="boxText">Linear 64 -> 1</text>

  <rect x="1210" y="684" width="190" height="112" rx="22" fill="url(#mainBox)" filter="url(#shadow)"/>
  <text x="1238" y="724" class="boxTitle">Output</text>
  <text x="1238" y="752" class="boxText">predicted angle</text>
  <text x="1238" y="774" class="boxText">shape: [B]</text>

  <path d="M655 586C655 632 786 632 786 664" class="thinConnector"/>
  <path d="M928 586C928 620 928 620 928 664" class="thinConnector"/>
  <path d="M1200 586C1200 632 1064 632 1064 664" class="thinConnector"/>
  <path d="M1135 740H1210" class="connector"/>

  <text x="70" y="470" class="section">ResidualMambaBlock detail</text>
  <rect x="70" y="506" width="560" height="352" rx="26" fill="#FFFFFF" stroke="#D7E1EB" stroke-width="2" filter="url(#shadow)"/>
  <text x="98" y="545" class="lightBoxTitle">Inside each ResidualMambaBlock</text>
  <text x="98" y="571" class="note">Token mixing happens over the flattened 3D grid: N = D x H x W</text>

  <rect x="98" y="610" width="110" height="62" rx="16" fill="#E7F1F6"/>
  <text x="121" y="647" class="lightBoxText">input x</text>

  <rect x="238" y="595" width="126" height="92" rx="16" fill="#F8EDE6"/>
  <text x="268" y="627" class="lightBoxTitle">pre_norm</text>
  <text x="264" y="651" class="lightBoxText">GroupNorm</text>
  <text x="257" y="671" class="lightBoxText">1x1x1 conv</text>

  <rect x="394" y="595" width="176" height="92" rx="16" fill="#EDF3FA"/>
  <text x="420" y="627" class="lightBoxTitle">tokenize</text>
  <text x="420" y="651" class="lightBoxText">reshape [B,C,D,H,W]</text>
  <text x="420" y="671" class="lightBoxText">to [B,N,C]</text>

  <path d="M208 641H238" class="connector"/>
  <path d="M364 641H394" class="connector"/>

  <rect x="150" y="730" width="170" height="92" rx="16" fill="#E8F4EC"/>
  <text x="183" y="762" class="lightBoxTitle">Mamba SSM</text>
  <text x="177" y="786" class="lightBoxText">d_model = C</text>
  <text x="177" y="806" class="lightBoxText">d_state = 8</text>

  <rect x="352" y="730" width="124" height="92" rx="16" fill="#F8EDE6"/>
  <text x="380" y="762" class="lightBoxTitle">project</text>
  <text x="377" y="786" class="lightBoxText">GroupNorm</text>
  <text x="370" y="806" class="lightBoxText">1x1x1 conv</text>

  <rect x="508" y="730" width="94" height="92" rx="16" fill="#EEE7F7"/>
  <text x="533" y="773" class="lightBoxTitle">add</text>
  <text x="522" y="798" class="lightBoxText">residual</text>

  <path d="M482 687V730" class="thinConnector"/>
  <path d="M320 776H352" class="connector"/>
  <path d="M476 776H508" class="connector"/>
  <path d="M208 641C170 641 150 691 150 776" class="thinConnector dashed"/>
  <text x="105" y="708" class="note">skip path</text>

  <text x="98" y="902" class="note">Source: regression/networks/mamba_regressor.py</text>
  <text x="715" y="854" class="note">The model concatenates pooled features from stages 1, 2, and 3 before the MLP head.</text>
</svg>
